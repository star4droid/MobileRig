name: Build APK and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to use the app version, e.g. v0.0.1)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: ver
        run: |
          V=$(grep -m1 'versionName' android/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: ./gradlew :android:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          APK=$(find android/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" "MobiRig-${{ steps.ver.outputs.version }}.apk"
          ls -lh MobiRig-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MobiRig ${{ steps.ver.outputs.version }}
          body_path: .github/release-notes.md
          prerelease: ${{ inputs.prerelease }}
          files: MobiRig-${{ steps.ver.outputs.version }}.apk
          fail_on_unmatched_files: true
